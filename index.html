<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material 3 Portofolio</title>
    
    <!-- Load Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Fonts: Roboto & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    
    <style>
        /* CSS Variables untuk Material 3 Light & Dark Color Schemes */
        :root {
            /* Light Theme */
            --md-sys-color-background: #FEF7FF;
            --md-sys-color-on-background: #1D1B20;
            --md-sys-color-surface: #FEF7FF;
            --md-sys-color-surface-container: #F3EDF7;
            --md-sys-color-surface-container-highest: #E6E0E9;
            --md-sys-color-on-surface: #1D1B20;
            --md-sys-color-on-surface-variant: #49454F;
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-secondary-container: #E8DEF8;
            --md-sys-color-on-secondary-container: #1D192B;
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --md-sys-color-background: #141218;
            --md-sys-color-on-background: #E6E0E9;
            --md-sys-color-surface: #141218;
            --md-sys-color-surface-container: #211F26;
            --md-sys-color-surface-container-highest: #36343B;
            --md-sys-color-on-surface: #E6E0E9;
            --md-sys-color-on-surface-variant: #CAC4D0;
            --md-sys-color-primary: #D0BCFF;
            --md-sys-color-on-primary: #381E72;
            --md-sys-color-secondary-container: #4A4458;
            --md-sys-color-on-secondary-container: #E8DEF8;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
        }

        /* Smooth CSS Transitions untuk Theme Switching */
        *, *::before, *::after {
            transition: background-color 0.4s ease, color 0.4s ease, fill 0.4s ease, transform 0.2s ease;
        }

        /* Styling spesifik Material 3 Component */
        .m3-card {
            background-color: var(--md-sys-color-surface-container);
            border-radius: 28px; /* Sudut besar khas Material 3 */
        }
        
        .m3-text-headline {
            color: var(--md-sys-color-on-surface);
        }

        .m3-text-body {
            color: var(--md-sys-color-on-surface-variant);
        }

        .m3-icon-btn {
            color: var(--md-sys-color-on-surface-variant);
            border-radius: 50%;
        }

        .m3-icon-btn:hover {
            background-color: var(--md-sys-color-surface-container-highest);
            color: var(--md-sys-color-on-surface);
        }
        
        .m3-social-btn {
            fill: var(--md-sys-color-on-surface-variant);
        }

        .m3-icon-btn:hover .m3-social-btn {
            fill: var(--md-sys-color-primary); /* Menggunakan warna primary saat di-hover */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased selection:bg-[#E8DEF8] selection:text-[#1D192B]">

    <!-- Main Card Container -->
    <main class="m3-card w-full max-w-md p-8 sm:p-10 relative shadow-sm">
        
        <!-- Theme Toggle Button (Icon Button di kanan atas card) -->
        <button id="theme-toggle" aria-label="Toggle Dark Mode" class="m3-icon-btn absolute top-5 right-5 w-12 h-12 flex items-center justify-center cursor-pointer outline-none focus:ring-2 focus:ring-[var(--md-sys-color-primary)]">
            <!-- Ikon secara default memuat icon bulan untuk beralih ke dark mode -->
            <span id="theme-icon" class="material-symbols-outlined text-[28px]">
                dark_mode
            </span>
        </button>

        <div class="mt-4">
            <!-- Profil Text -->
            <h1 class="m3-text-headline text-3xl sm:text-4xl font-medium tracking-tight mb-4">
                Rizqi Tovian
            </h1>
            
            <p class="m3-text-body text-base sm:text-lg font-normal leading-relaxed mb-8">
                Desainer & Pengembang Web yang berfokus pada pengalaman pengguna yang intuitif, desain yang bersih, dan antarmuka responsif.
            </p>
            
            <!-- Link Sosial Media -->
            <div class="flex items-center gap-2 -ml-2">
                <!-- Instagram -->
                <a href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram" 
                   class="m3-icon-btn w-12 h-12 flex items-center justify-center focus:ring-2 focus:ring-[var(--md-sys-color-primary)] outline-none">
                    <svg class="m3-social-btn w-6 h-6" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
                    </svg>
                </a>
    
                <!-- LinkedIn -->
                <a href="#" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"
                   class="m3-icon-btn w-12 h-12 flex items-center justify-center focus:ring-2 focus:ring-[var(--md-sys-color-primary)] outline-none">
                    <svg class="m3-social-btn w-6 h-6" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                    </svg>
                </a>
    
                <!-- GitHub -->
                <a href="#" target="_blank" rel="noopener noreferrer" aria-label="GitHub"
                   class="m3-icon-btn w-12 h-12 flex items-center justify-center focus:ring-2 focus:ring-[var(--md-sys-color-primary)] outline-none">
                    <svg class="m3-social-btn w-6 h-6" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                    </svg>
                </a>
    
                <!-- Twitter -->
                <a href="#" target="_blank" rel="noopener noreferrer" aria-label="Twitter X"
                   class="m3-icon-btn w-12 h-12 flex items-center justify-center focus:ring-2 focus:ring-[var(--md-sys-color-primary)] outline-none">
                    <svg class="m3-social-btn w-[22px] h-[22px]" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/>
                    </svg>
                </a>
            </div>
        </div>
    </main>

    <script>
        // Logika untuk beralih antara Mode Terang dan Mode Gelap
        const toggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        toggleBtn.addEventListener('click', () => {
            // Cek tema saat ini
            const currentTheme = htmlElement.getAttribute('data-theme');
            
            // Tukar tema
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-theme', newTheme);
            
            // Ganti ikon sesuai dengan tema baru yang aktif
            // Jika mode gelap aktif, tampilkan ikon matahari untuk kembali ke mode terang
            themeIcon.textContent = newTheme === 'dark' ? 'light_mode' : 'dark_mode';
        });
    </script>
</body>
</html>
